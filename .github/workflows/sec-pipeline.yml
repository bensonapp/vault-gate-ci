name: Vault Gate CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  security-scans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: 'p/default'

      - name: Run Trivy SCA scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          output: 'trivy-report.txt'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sca-report
          path: trivy-report.txt

      # 4. Сборка и запуск API в изолированном контейнере
      - name: Build and Run VAmPI in Docker
        run: |
          docker build -t vampi-api .
          docker run -d -p 5000:5000 vampi-api
          sleep 15 # Ждем 15 секунд, чтобы сервер успел запуститься

      # 5. Динамическое сканирование (DAST)
      - name: Run OWASP ZAP DAST scan
        uses: zaproxy/action-baseline@master
        with:
          target: 'http://localhost:5000'
          artifact_name: 'zap-report'